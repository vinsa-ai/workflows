name: Build docker image
on:
    workflow_call:
        inputs:
            install_script:
                type: string
                required: false
                default: ""

            dockerfile:
                type: string
                required: false
                default: "Dockerfile"

            docker_context:
                type: string
                required: false
                default: "."

            include_pip_list:
                type: boolean
                required: false
                default: false

            pip_filter:
                type: string
                required: false
                default: ""

            use_lfs:
                type: boolean
                required: false
                default: false

            has_ssh_key:
                type: boolean
                required: false
                default: false

            push_to_ecr:
                type: boolean
                required: false
                default: true

        secrets:
            REPOSITORY_USER_TOKEN:
                required: true
            ACTIONS_SSH_KEY:
                required: false
            QUAY_USERNAME:
                required: false
            QUAY_TOKEN:
                required: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    QUAY_REGISTRY: quay.io

jobs:
    docker_build:
        runs-on: larger-runner-x64
        outputs:
            image_tags: ${{ steps.metadata.outputs.tags }}
            version: ${{ steps.metadata.outputs.version }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Allocate space for Docker on the SSD
              run: |
                  sudo systemctl stop docker
                  sudo chmod a+rw /mnt
                  sudo mkdir /mnt/docker
                  sudo ln -s /mnt/docker /var/lib/docker
                  sudo systemctl start docker
                  df -hT

            - name: Checkout
              uses: actions/checkout@v7.0.0
              with:
                  lfs: ${{ inputs.use_lfs }}

            - name: Checkout LFS objects if needed
              if: ${{ inputs.use_lfs }}
              run: git lfs checkout

            - name: Log in to the Container registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.REPOSITORY_USER_TOKEN }}

            - name: Log in to the Container registry (again/differently)
              run: echo "${{ secrets.REPOSITORY_USER_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4.1.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Extract metadata (tags, labels) for Docker
              id: metadata
              uses: docker/metadata-action@v6.1.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Update version environment variable if possible
              run: |
                  if [ -e ${{ inputs.dockerfile }} ]; then sed -i -E 's/(CONTAINER|MODEL)_RELEASE_VERSION=(unknown|local|\$\{[^}]+\})/\1_RELEASE_VERSION=${{ steps.metadata.outputs.version }}/g' "${{ inputs.dockerfile }}"; fi

            - name: Execute install script
              if: ${{ inputs.install_script != '' }}
              run: ${{ inputs.install_script }}

            - name: Setup SSH
              if: ${{ inputs.has_ssh_key }}
              uses: MrSquaare/ssh-setup-action@v4.0.0
              with:
                  host: github.com
                  private-key: ${{ secrets.ACTIONS_SSH_KEY }}

            - name: Build Docker image (with SSH)
              if: ${{ inputs.has_ssh_key }}
              uses: docker/build-push-action@v7.2.0
              with:
                  context: ${{ inputs.docker_context }}
                  file: ${{ inputs.dockerfile }}
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  ssh: default=${{ env.SSH_AUTH_SOCK }}

            - name: Build Docker image (without SSH)
              if: ${{ !inputs.has_ssh_key }}
              uses: docker/build-push-action@v7.2.0
              with:
                  context: ${{ inputs.docker_context }}
                  file: ${{ inputs.dockerfile }}
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}

            - name: Prepare Release Notes 2.0
              env:
                  DOCKER_IMAGE_ID: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  GITHUB_TOKEN: ${{ secrets.REPOSITORY_USER_TOKEN }}
              run: |
                  gh release view ${GITHUB_REF_NAME} -R ${GITHUB_REPOSITORY} --json body --jq .body > release-notes.txt

            - name: Pip List
              if: ${{ inputs.include_pip_list }}
              env:
                  DOCKER_IMAGE_ID: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  GITHUB_TOKEN: ${{ secrets.REPOSITORY_USER_TOKEN }}
              run: |
                  echo "## Installed Python Libraries (AMD64)" >> release-notes.txt
                  echo "<pre>" >> release-notes.txt
                  docker run --rm --entrypoint= "${DOCKER_IMAGE_ID}:${DOCKER_METADATA_OUTPUT_VERSION}" pip list --verbose | grep "${{ inputs.pip_filter }}" >> release-notes.txt
                  echo "</pre>" >> release-notes.txt

            - name: Attach docker image to release
              uses: softprops/action-gh-release@v3.0.1
              env:
                  GITHUB_TOKEN: ${{ secrets.REPOSITORY_USER_TOKEN }}
              with:
                  tag_name: ${{ env.GITHUB_REF_NAME }}
                  body_path: release-notes.txt
                  token: ${{ secrets.REPOSITORY_USER_TOKEN }}

    push_to_ecr:
        needs: docker_build
        if: ${{ inputs.push_to_ecr }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
            id-token: write

        steps:
            - name: Log in to the Container registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.REPOSITORY_USER_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4.0.2
              with:
                  role-to-assume: arn:aws:iam::429352483044:role/GitHubActionsEcrPush
                  aws-region: us-east-1

            - name: Log in to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2.0.1

            - name: Copy image to Amazon ECR
              env:
                  ECR_REGISTRY: 429352483044.dkr.ecr.us-east-1.amazonaws.com
                  IMAGE_TAGS: ${{ needs.docker_build.outputs.image_tags }}
              run: |
                  set -euo pipefail
                  while read -r tag; do
                      [ -n "$tag" ] || continue
                      path="${tag##*/}"
                      repo="${path%:*}"
                      version="${path##*:}"

                      if printf '%s' "${version}" | grep -qE '^([0-9]+(\.[0-9]+)?|latest)$'; then
                          echo "skipping ${tag}, floating tags are not copied to ECR"
                          continue
                      fi

                      dest="${ECR_REGISTRY}/${path}"

                      ours=$(docker buildx imagetools inspect \
                                 --format '{{.Manifest.Digest}}' "${tag}")
                      if [ -z "${ours}" ]; then
                          echo "could not read the digest of ${tag}" >&2
                          exit 1
                      fi

                      set +e
                      lookup=$(aws ecr describe-images --repository-name "${repo}" \
                                   --image-ids "imageTag=${version}" \
                                   --query 'imageDetails[0].imageDigest' --output text 2>&1)
                      rc=$?
                      set -e

                      if [ $rc -eq 0 ]; then
                          if [ "${lookup}" = "${ours}" ]; then
                              echo "already in ECR with the same digest, skipping: ${dest}"
                              continue
                          fi
                          echo "${dest} already exists but holds a different image" >&2
                          echo "  in ECR : ${lookup}" >&2
                          echo "  ours   : ${ours}" >&2
                          exit 1
                      fi

                      if grep -q "(RepositoryNotFoundException)" <<< "${lookup}"; then
                          echo "::warning::skipping ${tag}, no ECR repository named ${repo} exists"
                          continue
                      fi

                      if ! grep -q "ImageNotFoundException" <<< "${lookup}"; then
                          echo "could not check ECR for ${dest}:" >&2
                          echo "${lookup}" >&2
                          exit 1
                      fi

                      echo "copying ${tag} to ${dest}"
                      if ! docker buildx imagetools create --tag "${dest}" "${tag}"; then
                          landed=$(aws ecr describe-images --repository-name "${repo}" \
                                       --image-ids "imageTag=${version}" \
                                       --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
                          if [ "${landed}" = "${ours}" ]; then
                              echo "another build published the same image at ${dest}, continuing"
                              continue
                          fi
                          echo "push failed and ${dest} does not hold this image" >&2
                          echo "  in ECR : ${landed:-nothing}" >&2
                          echo "  ours   : ${ours}" >&2
                          exit 1
                      fi
                  done <<< "${IMAGE_TAGS}"

    mirror_to_quay:
        needs: docker_build
        if: ${{ !contains(needs.docker_build.outputs.version, '-') }}
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
            packages: read

        steps:
            - name: Resolve Quay image name
              run: echo "QUAY_IMAGE_NAME=inflightai/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

            - name: Check for Quay credentials
              id: quay_creds
              env:
                  QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
                  QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
              run: |
                  if [ -n "$QUAY_USERNAME" ] && [ -n "$QUAY_TOKEN" ]; then
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "configured=false" >> "$GITHUB_OUTPUT"
                      echo "::warning::QUAY_USERNAME/QUAY_TOKEN are not set; skipping the Quay mirror. The GHCR build is unaffected."
                  fi

            - name: Extract Quay metadata (tags)
              id: quay_metadata
              if: steps.quay_creds.outputs.configured == 'true'
              uses: docker/metadata-action@v6.1.0
              with:
                  images: ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Install skopeo
              if: steps.quay_creds.outputs.configured == 'true'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq skopeo

            - name: Log in to both registries
              if: steps.quay_creds.outputs.configured == 'true'
              env:
                  GHCR_USERNAME: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.REPOSITORY_USER_TOKEN }}
                  QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
                  QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
              run: |
                  set -euo pipefail
                  printf '%s' "$GHCR_TOKEN" | skopeo login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
                  printf '%s' "$QUAY_TOKEN" | skopeo login "$QUAY_REGISTRY" -u "$QUAY_USERNAME" --password-stdin

            - name: Mirror the built image to Quay
              if: steps.quay_creds.outputs.configured == 'true'
              env:
                  SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker_build.outputs.version }}
                  QUAY_TAGS: ${{ steps.quay_metadata.outputs.tags }}
              run: |
                  set -euo pipefail
                  if [ -z "${QUAY_TAGS//[[:space:]]/}" ]; then
                      echo "::error::No Quay tags were resolved for ${SOURCE_IMAGE}."
                      exit 1
                  fi
                  while IFS= read -r tag; do
                      [ -n "$tag" ] || continue
                      echo "mirroring ${SOURCE_IMAGE} to ${tag}"
                      skopeo copy --override-os linux --override-arch amd64 \
                          "docker://${SOURCE_IMAGE}" "docker://${tag}"
                  done <<< "$QUAY_TAGS"

            - name: Verify each Quay tag is a single amd64 manifest
              if: steps.quay_creds.outputs.configured == 'true'
              env:
                  QUAY_TAGS: ${{ steps.quay_metadata.outputs.tags }}
              run: |
                  set -euo pipefail
                  while IFS= read -r tag; do
                      [ -n "$tag" ] || continue
                      raw=$(skopeo inspect --raw "docker://${tag}")
                      media=$(printf '%s' "$raw" | jq -r '.mediaType // ""')
                      case "$media" in
                          *index*|*manifest.list*)
                              echo "::error::${tag} is ${media}, expected a single amd64 manifest"
                              exit 1
                              ;;
                      esac
                      echo "verified ${tag} (${media})"
                  done <<< "$QUAY_TAGS"

            - name: Log out of both registries
              if: always() && steps.quay_creds.outputs.configured == 'true'
              run: |
                  skopeo logout "$REGISTRY" || true
                  skopeo logout "$QUAY_REGISTRY" || true
